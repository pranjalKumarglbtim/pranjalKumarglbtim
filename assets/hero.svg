<style>
.pulse{animation:pulse 3s ease-in-out infinite}.float{animation:float 5s ease-in-out infinite}.scan{animation:scan 4.5s linear infinite}.dash{stroke-dasharray:10 18;animation:dash 3s linear infinite}.blink{animation:blink 1s steps(2,end) infinite}.orbit{transform-origin:1160px 302px;animation:orbit 9s linear infinite}
@keyframes pulse{50%{opacity:.48;transform:scale(1.08)}} @keyframes float{50%{transform:translateY(-14px)}} @keyframes scan{0%{transform:translateY(0);opacity:0}20%{opacity:.5}100%{transform:translateY(430px);opacity:0}} @keyframes dash{to{stroke-dashoffset:-56}} @keyframes blink{50%{opacity:0}} @keyframes orbit{to{transform:rotate(360deg)}}
</style>
</defs>
