<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500" role="img" aria-label="Pranjal Kumar Software Developer">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050B24"/><stop offset=".48" stop-color="#11134A"/><stop offset="1" stop-color="#240B3F"/></linearGradient>
 <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#20E7FF"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#FF4FD8"/></linearGradient>
 <radialGradient id="cyan"><stop stop-color="#00D9FF" stop-opacity=".28"/><stop offset="1" stop-color="#00D9FF" stop-opacity="0"/></radialGradient>
 <radialGradient id="pink"><stop stop-color="#FF4FD8" stop-opacity=".2"/><stop offset="1" stop-color="#FF4FD8" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#6EE7FF" stroke-opacity=".07"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <style>
 .pulse{animation:pulse 3s ease-in-out infinite}.dash{stroke-dasharray:14 22;animation:dash 3s linear infinite}.scan{animation:scan 4s linear infinite}.float{animation:float 4s ease-in-out infinite}.blink{animation:blink 1s steps(2,end) infinite}
 @keyframes pulse{50%{opacity:.65;transform:scale(1.08)}}@keyframes dash{to{stroke-dashoffset:-72}}@keyframes scan{0%{transform:translateY(-40px);opacity:0}20%{opacity:.4}100%{transform:translateY(380px);opacity:0}}@keyframes float{50%{transform:translateY(-8px)}}@keyframes blink{50%{opacity:0}}
 </style>
</defs>
