<style>
.pulse{animation:pulse 3s ease-in-out infinite}.float{animation:float 5s ease-in-out infinite}.scan{animation:scan 4s linear infinite}.dash{stroke-dasharray:12 20;animation:dash 3s linear infinite}.orbit{transform-origin:1070px 276px;animation:orbit 8s linear infinite}.blink{animation:blink 1s steps(2,end) infinite}
@keyframes pulse{50%{opacity:.65;transform:scale(1.07)}}@keyframes float{50%{transform:translateY(-10px)}}@keyframes scan{0%{transform:translateY(0);opacity:0}20%{opacity:.45}100%{transform:translateY(470px);opacity:0}}@keyframes dash{to{stroke-dashoffset:-64}}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes blink{50%{opacity:0}}
</style>
